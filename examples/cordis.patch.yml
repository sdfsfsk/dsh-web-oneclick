# 局域网开放补丁示例
#
# 用法：打开 %USERPROFILE%\.dsh\profiles\web\cordis.patch.yml（首次运行
# `dsh web` 后自动生成，内容是一个空的 YAML 数组 `[]`），把下面这段
# 追加进去（数组项），然后重启 dsh web。
#
# 原理：dsh 的 CLI 出于安全考虑拒绝 --host 0.0.0.0 通配绑定，而 webserver
# 插件的配置模式只接受 "127.0.0.1" 或 "0.0.0.0" 字面值（绑定具体局域网 IP
# 会被模式校验拒绝）。补丁层在 CLI 之下合成配置，可以合法地把 host 写成
# 0.0.0.0。绑定通配地址时，/api 的浏览器信任栅栏会自动把本机全部局域网
# IPv4 地址加入白名单，手机直接访问 http://<局域网IP>:<端口> 即可。
#
# port 保留 !!js 表达式，命令行 --port 参数继续生效。
#
# 安全提示：0.0.0.0 会让同一网络里的所有设备都能打开 Web GUI（桌面版界面
# 没有登录认证；改设置、写凭据等特权接口虽然仍被官方钉死在仅本机可用，
# 但会话和工具执行是可以被同网设备使用的）。请只在可信的家庭/办公网络
# 开启，公共 Wi-Fi 下把这段补丁删掉再重启即可恢复原样。

- id: webserver
  config:
    host: 0.0.0.0
    port: !!js ctx.webStartup.port ?? 3080
